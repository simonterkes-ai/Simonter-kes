<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIMONTERKES</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:url('bg.jpg') no-repeat center center;
      background-size:cover;
      min-height:100vh;

      display:flex;
      justify-content:center;
      align-items:center;

      position:relative;
      overflow:hidden;
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      inset:0;
      background:rgba(0,0,0,0.58);
    }

    /* CONTAINER */
    .container{
      position:relative;
      z-index:2;

      width:90%;
      max-width:650px;

      text-align:center;
      color:white;
    }

    /* LOGO */
    .logo-container{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:16px;

      margin-bottom:18px;
    }

    .logo-sigi{
      width:105px;
      height:105px;

      object-fit:contain;

      background:white;
      padding:10px;
      border-radius:22px;

      box-shadow:
      0 8px 20px rgba(0,0,0,0.25);
    }

    .logo-kemenkes{
      width:82px;
      height:82px;

      object-fit:contain;

      background:white;
      padding:10px;
      border-radius:20px;

      box-shadow:
      0 8px 20px rgba(0,0,0,0.25);
    }

    /* TITLE */
    h1{
      font-size:58px;
      font-weight:700;

      margin-bottom:10px;

      text-shadow:
      0 5px 15px rgba(0,0,0,0.4);
    }

    p{
      font-size:24px;
      line-height:1.6;

      color:rgba(255,255,255,0.92);

      margin-bottom:40px;
    }

    /* LINK */
    a{
      text-decoration:none;
    }

    /* CARD */
    .card{
      width:100%;

      background:rgba(255,255,255,0.96);

      padding:28px 30px;
      margin-bottom:22px;

      border-radius:32px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:#1f2937;

      font-size:30px;
      font-weight:500;

      box-shadow:
      0 10px 25px rgba(0,0,0,0.28);

      transition:0.3s ease;
    }

    .card:hover{
      transform:translateY(-4px);
      background:white;
    }

    .card-left{
      display:flex;
      align-items:center;
      gap:18px;
    }

    .icon{
      font-size:36px;
    }

    .arrow{
      font-size:34px;
      color:#6b7280;
    }

    /* FOOTER */
    .footer{
      margin-top:10px;

      font-size:20px;
      color:rgba(255,255,255,0.92);
    }

    /* MOBILE */
    @media(max-width:768px){

      h1{
        font-size:34px;
      }

      p{
        font-size:16px;
      }

      .card{
        font-size:18px;
        padding:20px;
        border-radius:22px;
      }

      .icon{
        font-size:24px;
      }

      .arrow{
        font-size:24px;
      }

      .logo-sigi{
        width:80px;
        height:80px;
      }

      .logo-kemenkes{
        width:62px;
        height:62px;
      }

      .footer{
        font-size:14px;
      }

    }

  </style>
</head>

<body>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- CONTENT -->
  <div class="container">

    <!-- LOGO -->
    <div class="logo-container">

      <img src="logo-sigi.png" class="logo-sigi">

      <img src="logo-kemenkes.png" class="logo-kemenkes">

    </div>

    <!-- TITLE -->
    <h1>Dinas Kesehatan Kab. Sigi</h1>

    <p>
      Sistem Monitoring & Perencanaan Kesehatan (Simonterkes)
    </p>

    <!-- CARD 1 -->
    <a href="https://docs.google.com/spreadsheets/d/1uAvLcHHPIEE90eYo2Glb-yQfopp88z4euRZwfoH2lP8/edit?gid=1595741466" target="_blank">

      <div class="card">

        <div class="card-left">
          <div class="icon">📊</div>
          <div>Rekap Monitoring & Evaluasi</div>
        </div>

        <div class="arrow">→</div>

      </div>

    </a>

    <!-- CARD 2 -->
    <a href="dashboard.html">

      <div class="card">

        <div class="card-left">
          <div class="icon">🌐</div>
          <div>Dashboard Arsip Data</div>
        </div>

        <div class="arrow">→</div>

      </div>

    </a>

    <!-- FOOTER -->
    <div class="footer">
      © Dinas Kesehatan Kabupaten Sigi
    </div>

  </div>

</body>
</html>
