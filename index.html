<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMONTERKES</title>

  <!-- FONT -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:url('bg.jpg') no-repeat center center;
      background-size:cover;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      position:relative;
      overflow:hidden;
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      inset:0;
      background:
        linear-gradient(
          rgba(6, 22, 34, 0.75),
          rgba(6, 22, 34, 0.85)
        );
      backdrop-filter:blur(3px);
    }

    /* MAIN CONTAINER */
    .container{
      position:relative;
      z-index:2;
      width:92%;
      max-width:560px;
      padding:45px 35px;
      border-radius:32px;

      background:rgba(255,255,255,0.10);
      border:1px solid rgba(255,255,255,0.15);

      backdrop-filter:blur(14px);
      -webkit-backdrop-filter:blur(14px);

      box-shadow:
        0 10px 40px rgba(0,0,0,0.35);

      text-align:center;
      color:white;
    }

    /* LOGO */
    .logo-container{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:18px;
      margin-bottom:24px;
    }

    .logo{
      width:82px;
      height:82px;
      object-fit:contain;

      background:white;
      border-radius:22px;
      padding:10px;

      box-shadow:
        0 8px 20px rgba(0,0,0,0.25);
    }

    /* TITLE */
    h1{
      font-size:38px;
      font-weight:700;
      letter-spacing:1px;
      margin-bottom:10px;
    }

    .subtitle{
      font-size:17px;
      line-height:1.7;
      color:rgba(255,255,255,0.88);
      margin-bottom:38px;
    }

    /* CARD */
    a{
      text-decoration:none;
    }

    .card{
      width:100%;
      background:white;
      color:#1f2937;

      padding:20px 24px;
      margin-bottom:16px;

      border-radius:22px;

      display:flex;
      justify-content:space-between;
      align-items:center;

      font-size:17px;
      font-weight:600;

      transition:0.3s ease;

      box-shadow:
        0 8px 24px rgba(0,0,0,0.15);
    }

    .card-left{
      display:flex;
      align-items:center;
      gap:14px;
    }

    .icon{
      width:48px;
      height:48px;
      border-radius:14px;

      display:flex;
      justify-content:center;
      align-items:center;

      font-size:22px;
      background:#eef4ff;
    }

    .arrow{
      font-size:22px;
      color:#64748b;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-4px);
      box-shadow:
        0 12px 28px rgba(0,0,0,0.22);
    }

    .card:hover .arrow{
      transform:translateX(5px);
    }

    /* FOOTER */
    .footer{
      margin-top:26px;
      font-size:13px;
      color:rgba(255,255,255,0.75);
      letter-spacing:0.4px;
    }

    /* MOBILE */
    @media(max-width:600px){

      .container{
        padding:35px 22px;
      }

      h1{
        font-size:30px;
      }

      .subtitle{
        font-size:15px;
      }

      .card{
        padding:18px;
        font-size:15px;
      }

      .logo{
        width:70px;
        height:70px;
      }

      .icon{
        width:42px;
        height:42px;
        font-size:20px;
      }

    }

  </style>
</head>

<body>

  <!-- OVERLAY -->
  <div class="overlay"></div>

  <!-- CONTENT -->
  <div class="container">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="logo-sigi.png" class="logo">
      <img src="logo-kemenkes.png" class="logo">
    </div>

    <!-- TITLE -->
    <h1>SIMONTERKES</h1>

    <div class="subtitle">
      Sistem Monitoring & Perencanaan Kesehatan<br>
      Dinas Kesehatan Kabupaten Sigi
    </div>

    <!-- CARD 1 -->
    <a href="https://docs.google.com/spreadsheets/d/1uAvLcHHPIEE90eYo2Glb-yQfopp88z4euRZwfoH2lP8/edit?gid=1595741466" target="_blank">

      <div class="card">

        <div class="card-left">
          <div class="icon">📊</div>
          <div>Rekap Monitoring & Evaluasi</div>
        </div>

        <div class="arrow">→</div>

      </div>

    </a>

    <!-- CARD 2 -->
    <a href="https://1drv.ms/x/c/b5f243fb2c085bb2/IQBXqO9xoQdkQqn5o3y-gtDXAdT_VTWOIojxmpedyKBo6CU?e=czkQZf" target="_blank">

      <div class="card">

        <div class="card-left">
          <div class="icon">📑</div>
          <div>Rekap Data SPM</div>
        </div>

        <div class="arrow">→</div>

      </div>

    </a>

    <!-- CARD 3 -->
    <a href="https://script.google.com/macros/s/AKfycbzqD-6nsYvFkz5htZ76xPcS8HQ9ULeVLS5bYWhEjgKKTVhyaJcIeGlYzw0zrXId4fbUIA/exec" target="_blank">

      <div class="card">

        <div class="card-left">
          <div class="icon">🗂️</div>
          <div>Arsip Dokumen Perencanaan</div>
        </div>

        <div class="arrow">→</div>

      </div>

    </a>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 Dinas Kesehatan Kabupaten Sigi
    </div>

  </div>

</body>
</html>
