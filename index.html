<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SIMONTERKES</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Inter',sans-serif;
      background:url('bg.jpg') no-repeat center center;
      background-size:cover;
      min-height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      overflow:hidden;
      position:relative;
    }

    /* OVERLAY */
    .overlay{
      position:fixed;
      inset:0;
      background:linear-gradient(
        to bottom,
        rgba(0,0,0,0.45),
        rgba(0,0,0,0.75)
      );
      backdrop-filter:blur(2px);
    }

    /* CONTAINER */
    .container{
      position:relative;
      z-index:2;
      width:90%;
      max-width:560px;
      text-align:center;
      color:white;
      animation:fadeUp 1s ease;
    }

    @keyframes fadeUp{
      from{
        opacity:0;
        transform:translateY(30px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }

    /* LOGO */
    .logo-container{
      display:flex;
      justify-content:center;
      align-items:center;
      gap:18px;
      margin-bottom:18px;
    }

    .logo{
      width:95px;
      height:95px;
      object-fit:contain;
      background:rgba(255,255,255,0.95);
      padding:10px;
      border-radius:24px;
      box-shadow:0 10px 25px rgba(0,0,0,0.3);
      transition:0.3s;
    }

    .logo:hover{
      transform:translateY(-5px) scale(1.05);
    }

    /* TITLE */
    h1{
      font-size:42px;
      font-weight:700;
      margin-bottom:10px;
      text-shadow:0 5px 15px rgba(0,0,0,0.5);
    }

    p{
      font-size:18px;
      color:#f1f1f1;
      margin-bottom:35px;
      line-height:1.6;
    }

    /* CARD */
    a{
      text-decoration:none;
    }

    .card{
      background:rgba(255,255,255,0.95);
      color:#1f2937;
      padding:22px 24px;
      border-radius:26px;
      margin-bottom:18px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:20px;
      font-weight:600;
      transition:0.3s;
      box-shadow:0 12px 30px rgba(0,0,0,0.25);
      backdrop-filter:blur(8px);
    }

    .card:hover{
      transform:translateY(-5px) scale(1.02);
      background:white;
      box-shadow:0 16px 35px rgba(0,0,0,0.35);
    }

    .card span:last-child{
      font-size:24px;
      transition:0.3s;
    }

    .card:hover span:last-child{
      transform:translateX(6px);
    }

    /* FOOTER */
    .footer{
      margin-top:20px;
      font-size:14px;
      color:#e5e7eb;
      letter-spacing:0.5px;
    }

    /* MOBILE */
    @media(max-width:600px){

      h1{
        font-size:30px;
      }

      p{
        font-size:15px;
      }

      .card{
        font-size:17px;
        padding:18px 20px;
      }

      .logo{
        width:78px;
        height:78px;
      }

    }

  </style>
</head>

<body>

  <div class="overlay"></div>

  <div class="container">

    <!-- LOGO -->
    <div class="logo-container">
      <img src="logo-sigi.png" class="logo">
      <img src="logo-kemenkes.png" class="logo">
    </div>

    <!-- TITLE -->
    <h1>SIMONTERKES</h1>

    <p>
      Sistem Monitoring & Perencanaan Kesehatan<br>
      Dinas Kesehatan Kabupaten Sigi
    </p>

    <!-- CARD MONEV -->
    <a href="https://docs.google.com/spreadsheets/d/1uAvLcHHPIEE90eYo2Glb-yQfopp88z4euRZwfoH2lP8/edit?gid=1595741466" target="_blank">
      <div class="card">
        <span>📊 Rekap Monitoring & Evaluasi</span>
        <span>→</span>
      </div>
    </a>

    <!-- CARD SPM -->
    <a href="https://1drv.ms/x/c/b5f243fb2c085bb2/IQBXqO9xoQdkQqn5o3y-gtDXAdT_VTWOIojxmpedyKBo6CU?e=czkQZf" target="_blank">
      <div class="card">
        <span>📑 Rekap Data SPM</span>
        <span>→</span>
      </div>
    </a>

    <!-- CARD ARSIP -->
    <a href="https://script.google.com/macros/s/AKfycbzqD-6nsYvFkz5htZ76xPcS8HQ9ULeVLS5bYWhEjgKKTVhyaJcIeGlYzw0zrXId4fbUIA/exec" target="_blank">
      <div class="card">
        <span>🗂️ Arsip Dokumen Perencanaan</span>
        <span>→</span>
      </div>
    </a>

    <!-- FOOTER -->
    <div class="footer">
      © 2026 Dinas Kesehatan Kabupaten Sigi
    </div>

  </div>

</body>
</html>
